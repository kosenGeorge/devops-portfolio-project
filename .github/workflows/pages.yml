name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site (hub landing + /messenger/)
        run: |
          mkdir -p _site
          # Берём актуальный корневой index.html (старая докер-заглушка удалена из репозитория)
          cp index.html _site/index.html
          cp -r messenger-app _site/messenger
          rm -rf _site/messenger/node_modules _site/messenger/capacitor _site/messenger/serve.js
          # служебные файлы для Pages
          touch _site/.nojekyll

      - name: Verify no docker placeholder leaked
        run: |
          grep -qi "My Docker Website" _site/index.html && { echo "ERROR: old placeholder in _site"; exit 1; } || true
          grep -q "Мой DevOps Путь" _site/index.html || { echo "ERROR: landing page not extracted"; exit 1; }
          # на лендинге должна быть рабочая ссылка на мессенджер в подпапке Pages
          sed -i 's|href="/messenger/"|href="messenger/"|' _site/index.html
          test -f _site/messenger/index.html || { echo "ERROR: messenger missing"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
